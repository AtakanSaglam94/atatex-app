<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Comptoir — Gestion des commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232C;
    --ink-soft:#26363F;
    --paper:#EFF2EE;
    --panel:#FFFFFF;
    --accent:#0F6F5C;
    --accent-light:#DCEEE8;
    --warm:#D9772E;
    --warm-light:#FBEBDA;
    --danger:#B5402A;
    --danger-light:#F7E3DD;
    --line:#DDE1D9;
    --text:#1B2622;
    --text-soft:#5C6862;
    --text-faint:#8A948D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px;flex-shrink:0;background:var(--ink);color:#EDEFEA;
    display:flex;flex-direction:column;padding:22px 14px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:18px;}
  .brand-mark{width:30px;height:30px;border-radius:7px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:#231205;flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:#fff;}
  .brand-sub{font-size:10.5px;color:#93a099;letter-spacing:0.06em;text-transform:uppercase;}
  nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .navbtn{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
    background:none;border:none;color:#C7CFC7;text-align:left;font-size:13.5px;font-weight:500;
    transition:background .12s;
  }
  .navbtn svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .navbtn:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .navbtn.active{background:var(--warm);color:#291404;}
  .navbtn.active svg{opacity:1;}
  .navbtn .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,0.12);padding:1px 7px;border-radius:20px;}
  .navbtn.active .count{background:rgba(0,0,0,0.18);}
  .team-note{font-size:10.5px;color:#7E8B82;padding:10px 12px 0;border-top:1px solid rgba(255,255,255,0.1);margin-top:10px;line-height:1.5;}

  /* ---------- Main ---------- */
  main{flex:1;padding:28px 34px 60px;max-width:1180px;min-width:0;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .pagehead h1{font-size:26px;}
  .pagehead .sub{color:var(--text-soft);font-size:13.5px;margin-top:4px;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:13.5px;font-weight:500;white-space:nowrap;
  }
  .btn:hover{border-color:#c3cabd;}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{background:#0c5b4b;}
  .btn.warm{background:var(--warm);color:#fff;border-color:var(--warm);}
  .btn.ghost{border-color:transparent;background:none;padding:6px 10px;}
  .btn.danger-ghost{border-color:transparent;background:none;color:var(--danger);padding:6px 10px;}
  .btn svg{width:15px;height:15px;}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- Cards / grid ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);}
  .stat.warm::before{background:var(--warm);}
  .stat.danger::before{background:var(--danger);}
  .stat-label{font-size:11.5px;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.05em;}
  .stat-value{font-family:'Fraunces',serif;font-size:27px;font-weight:600;margin-top:5px;}
  .stat-hint{font-size:11.5px;color:var(--text-faint);margin-top:3px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .panel-head h3{font-size:15px;}
  .panel-body{padding:18px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-soft);padding:10px 18px;border-bottom:1px solid var(--line);font-weight:500;}
  td{padding:11px 18px;border-bottom:1px solid #EDEFE9;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBF8;}
  .empty-row td{text-align:center;color:var(--text-faint);padding:34px 18px;}

  .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap;}
  .badge.pending{background:var(--warm-light);color:#8A4B10;}
  .badge.prep{background:#E4EAF6;color:#2C4E8C;}
  .badge.shipped{background:#E7E9F7;color:#42419A;}
  .badge.done{background:var(--accent-light);color:#0B5645;}
  .badge.cancel{background:var(--danger-light);color:#8A2E1B;}
  .badge.paid{background:var(--accent-light);color:#0B5645;}
  .badge.unpaid{background:var(--danger-light);color:#8A2E1B;}
  .badge.low{background:var(--danger-light);color:#8A2E1B;}
  .badge.ok{background:#EEF0EA;color:var(--text-soft);}
  .badge.measure{background:#EEEDFE;color:#3C3489;}

  .search{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;background:#FAFBF8;min-width:200px;
  }
  .search input{border:none;background:none;outline:none;font-size:13px;width:100%;color:var(--text);}
  .search svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,28,25,0.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:100;overflow-y:auto;}
  .modal{background:var(--panel);border-radius:14px;width:100%;max-width:560px;padding:26px 26px 24px;margin-top:10px;}
  .modal.wide{max-width:760px;}
  .modal h2{font-size:19px;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--text-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#FCFDFB;color:var(--text);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .err{color:var(--danger);font-size:12px;margin-top:5px;display:none;}
  .err.show{display:block;}
  .hint{font-size:11.5px;color:var(--text-faint);margin-top:4px;}

  /* order builder */
  .item-card{border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:10px;background:#FAFBF8;}
  .item-top{display:grid;grid-template-columns:1fr 68px 88px 30px;gap:8px;align-items:center;}
  .item-top select,.item-top input{padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;}
  .iconbtn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .iconbtn svg{width:14px;height:14px;}
  .order-total{display:flex;flex-direction:column;gap:4px;padding-top:14px;margin-top:8px;border-top:1px dashed var(--line);}
  .order-total-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-soft);}
  .order-total-row.grand{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--text);padding-top:4px;}

  .measure-toggle{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;color:var(--text-soft);}
  .measure-panel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:7px;}
  .measure-panel .field{margin-bottom:0;}
  .measure-panel label{font-size:11px;}
  .measure-panel input{padding:7px 8px;font-size:12.5px;}
  .measure-result{grid-column:1/-1;font-size:12px;color:var(--accent);padding-top:2px;}

  .option-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .option-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px 4px 8px;font-size:12px;}
  .option-chip input{margin:0;}
  .option-chip.on{border-color:var(--accent);background:var(--accent-light);color:#0B5645;}

  .supp-row{display:grid;grid-template-columns:1fr 68px 100px 30px;gap:8px;align-items:center;}
  .supp-row input{padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;}

  /* ---------- Ticket (order detail / invoice) ---------- */
  .ticket{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:440px;overflow:hidden;}
  .ticket-top{padding:20px 22px 16px;}
  .ticket-top .tno{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-faint);}
  .ticket-top h2{font-size:20px;margin-top:4px;}
  .perf{height:0;border-top:2px dashed var(--line);position:relative;margin:0 0;}
  .perf::before,.perf::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--paper);}
  .perf::before{left:-9px;}
  .perf::after{right:-9px;}
  .ticket-body{padding:16px 22px;}
  .ticket-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;}
  .ticket-row.muted{color:var(--text-soft);font-size:12px;padding:2px 0 2px 14px;}
  .ticket-row.sub{color:var(--text-soft);font-size:13px;padding:4px 0;}
  .ticket-total{display:flex;justify-content:space-between;font-family:'Fraunces',serif;font-size:20px;font-weight:600;padding-top:10px;margin-top:4px;border-top:1px solid var(--line);}
  .ticket-foot{padding:14px 22px 20px;border-top:1px solid var(--line);}

  /* ---------- Catalog ---------- */
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .cat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;}
  .cat-swatch{width:100%;height:80px;border-radius:8px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  .cat-swatch svg{width:30px;height:30px;color:var(--accent);opacity:.75;}
  .cat-card h4{font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;}
  .cat-cat{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}
  .cat-price{font-family:'IBM Plex Mono',monospace;font-size:15px;margin-top:10px;}
  .cat-stock{font-size:11.5px;margin-top:6px;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
  .empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.5;}
  .empty-state p{font-size:13.5px;}

  select.status-select{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;background:#fff;}

  .tabs-mini{display:flex;gap:6px;margin-bottom:16px;}
  .tabs-mini button{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-soft);}
  .tabs-mini button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  .idea-list{display:grid;gap:10px;margin-top:10px;}
  .idea{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;}
  .idea svg{width:17px;height:17px;color:var(--accent);flex-shrink:0;margin-top:1px;}
  .idea b{font-size:13px;}
  .idea p{margin:2px 0 0;font-size:12.5px;color:var(--text-soft);line-height:1.5;}

  .note-box{background:var(--warm-light);color:#8A4B10;border-radius:9px;padding:11px 14px;font-size:12.5px;line-height:1.5;margin-top:12px;}

  @media (max-width:800px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:12px 14px;overflow-x:auto;}
    .brand{border:none;padding:0;margin:0 14px 0 0;}
    nav{flex-direction:row;flex:none;}
    .navbtn .count{display:none;}
    .team-note{display:none;}
    main{padding:20px 16px 50px;}
    .field-row,.field-row.three{grid-template-columns:1fr;}
    .settings-grid{grid-template-columns:1fr;}
    .measure-panel{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const ICONS = {
  dashboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>`,
  orders: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16l-1.5 12a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8L4 7Z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>`,
  stock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>`,
  clients: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16.5 6.2A3.2 3.2 0 0 1 18 12.2"/><path d="M21.5 20c0-3-1.9-5.2-4.5-5.9"/></svg>`,
  products: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>`,
  invoices: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l4 4v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>`,
  settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>`,
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/></svg>`,
  fabric: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 3v15c0 1.7 1.3 3 3 3s3-1.3 3-3V6c0-1.1.9-2 2-2s2 .9 2 2v15"/><path d="M4 3h14"/><path d="M14 6v13c0 1.7 1.3 3 3 3s3-1.3 3-3V3"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v13m0 0-4.5-4.5M12 16l4.5-4.5"/><path d="M4 19.5h16"/></svg>`,
  scissors: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><path d="M8.5 8 20 20M20 4 8.5 16"/></svg>`,
  bulb: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.9 1 1 1.7l.1.5h5l.1-.5c.1-.7.5-1.3 1-1.7A6 6 0 0 0 12 3Z"/></svg>`
};

const STORAGE_KEY = 'comptoir-data';
const uid = (p) => p + '-' + Math.random().toString(36).slice(2,8);
const eur = (n) => (Number(n)||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const UNIT_SHORT = {m:'m', piece:'pce', kit:'kit'};
const unitPrice = (p) => `${eur(p.price)} / ${UNIT_SHORT[p.unit]||'u.'}`;
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
const round2 = (n) => Math.round((Number(n)||0)*100)/100;

let state = {
  view: 'dashboard',
  data: { products: [], clients: [], orders: [], confectionOptions: [], company: {} },
  loading: true,
  saveError: false,
  search: '',
  invoiceFilter: 'all',
  modal: null,
};

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      state.data = migrateData(JSON.parse(res.value));
    } else {
      state.data = seedData();
      await persist();
    }
  }catch(e){
    state.data = seedData();
    try{ await persist(); }catch(e2){}
  }
  state.loading = false;
  render();
}

function migrateData(d){
  d.confectionOptions = d.confectionOptions || [];
  d.company = d.company || {name:'', vat:'', address:'', iban:'', email:'', vatRate:21};
  if(typeof d.company.vatRate !== 'number') d.company.vatRate = 21;
  d.orders = (d.orders||[]).map(o=>({
    ...o,
    items: (o.items||[]).map(it=> it.type ? it : {type:'product', productId:it.productId, qty:it.qty, price:it.price, unit:it.unit, measure:null, optionIds:[]})
  }));
  return d;
}

async function persist(){
  try{
    const r = await window.storage.set(STORAGE_KEY, JSON.stringify(state.data), true);
    if(!r) throw new Error('no result');
    state.saveError = false;
  }catch(e){
    state.saveError = true;
  }
}

function seedData(){
  const p1 = uid('prod'), p2 = uid('prod'), p3 = uid('prod'), p4 = uid('prod'), p5 = uid('prod'), p6 = uid('prod');
  const c1 = uid('cli'), c2 = uid('cli');
  const opt1 = uid('opt'), opt2 = uid('opt'), opt3 = uid('opt'), opt4 = uid('opt');

/* ---------------- helpers on data ---------------- */
function optionById(id){ return state.data.confectionOptions.find(o=>o.id===id); }
function itemLineTotal(item){
  if(item.type==='supplement') return (Number(item.qty)||0) * (Number(item.price)||0);
  const base = (Number(item.qty)||0) * (Number(item.price)||0);
  const addl = (item.optionIds||[]).reduce((s,oid)=>{
    const opt = optionById(oid); if(!opt) return s;
    const factor = opt.unit==='m' ? (Number(item.qty)||0) : (item.measure ? (Number(item.measure.panels)||1) : (Number(item.qty)||1));
    return s + opt.price*factor;
  },0);
  return base + addl;
}
function orderHT(o){ return round2(o.items.reduce((s,i)=>s+itemLineTotal(i),0)); }
function orderTotals(o){
  const ht = orderHT(o);
  const rate = (state.data.company && typeof state.data.company.vatRate==='number') ? state.data.company.vatRate : 21;
  const tva = round2(ht*rate/100);
  return {ht, tva, ttc: round2(ht+tva), rate};
}
function clientName(id){ const c = state.data.clients.find(c=>c.id===id); return c ? c.name : 'Client supprimé'; }
function productName(id){ const p = state.data.products.find(p=>p.id===id); return p ? p.name : 'Produit supprimé'; }
function productById(id){ return state.data.products.find(p=>p.id===id); }
function computeMeasureQty(width, height, panels){
  const h = Number(height)||0, n = Number(panels)||1;
  return round2(n * (h/100 + 0.2));
}

/* ---------------- UBL / Peppol export ---------------- */
function escapeXml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}
function generateUBL(order){
  const c = state.data.company || {};
  const client = state.data.clients.find(cl=>cl.id===order.clientId) || {};
  const totals = orderTotals(order);
  const invId = `FAC-${order.id.slice(-6)}`;
  const lines = order.items.map((it,idx)=>{
    const name = it.type==='supplement' ? (it.description||'Supplément') : productName(it.productId);
    const qty = it.qty || 1;
    const unitCode = it.type!=='supplement' && it.unit==='m' ? 'MTR' : 'C62';
    const lineTotal = round2(itemLineTotal(it));
    const unitPriceVal = qty ? round2(lineTotal/qty) : lineTotal;
    return `  <cac:InvoiceLine>
    <cbc:ID>${idx+1}</cbc:ID>
    <cbc:InvoicedQuantity unitCode="${unitCode}">${qty}</cbc:InvoicedQuantity>
    <cbc:LineExtensionAmount currencyID="EUR">${lineTotal.toFixed(2)}</cbc:LineExtensionAmount>
    <cac:Item>
      <cbc:Name>${escapeXml(name)}</cbc:Name>
    </cac:Item>
    <cac:Price>
      <cbc:PriceAmount currencyID="EUR">${unitPriceVal.toFixed(2)}</cbc:PriceAmount>
    </cac:Price>
  </cac:InvoiceLine>`;
  }).join('\n');

  return `<?xml version="1.0" encoding="UTF-8"?>
<Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"
  xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2"
  xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2">
  <cbc:CustomizationID>urn:cen.eu:en16931:2017#compliant#urn:fdc:peppol.eu:2017:poacc:billing:3.0</cbc:CustomizationID>
  <cbc:ProfileID>urn:fdc:peppol.eu:2017:poacc:billing:01:1.0</cbc:ProfileID>
  <cbc:ID>${escapeXml(invId)}</cbc:ID>
  <cbc:IssueDate>${order.date}</cbc:IssueDate>
  <cbc:InvoiceTypeCode>380</cbc:InvoiceTypeCode>
  <cbc:DocumentCurrencyCode>EUR</cbc:DocumentCurrencyCode>
  <cac:AccountingSupplierParty>
    <cac:Party>
      <cac:PartyName><cbc:Name>${escapeXml(c.name)}</cbc:Name></cac:PartyName>
      <cac:PostalAddress><cbc:StreetName>${escapeXml(c.address)}</cbc:StreetName><cac:Country><cbc:IdentificationCode>BE</cbc:IdentificationCode></cac:Country></cac:PostalAddress>
      <cac:PartyTaxScheme><cbc:CompanyID>${escapeXml(c.vat)}</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>
      <cac:Contact><cbc:ElectronicMail>${escapeXml(c.email)}</cbc:ElectronicMail></cac:Contact>
    </cac:Party>
  </cac:AccountingSupplierParty>
  <cac:AccountingCustomerParty>
    <cac:Party>
      <cac:PartyName><cbc:Name>${escapeXml(client.name)}</cbc:Name></cac:PartyName>
      <cac:PostalAddress><cbc:StreetName>${escapeXml(client.address)}</cbc:StreetName><cac:Country><cbc:IdentificationCode>BE</cbc:IdentificationCode></cac:Country></cac:PostalAddress>
      ${client.vat ? `<cac:PartyTaxScheme><cbc:CompanyID>${escapeXml(client.vat)}</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>` : ''}
      <cac:Contact><cbc:ElectronicMail>${escapeXml(client.email)}</cbc:ElectronicMail></cac:Contact>
    </cac:Party>
  </cac:AccountingCustomerParty>
  <cac:TaxTotal>
    <cbc:TaxAmount currencyID="EUR">${totals.tva.toFixed(2)}</cbc:TaxAmount>
    <cac:TaxSubtotal>
      <cbc:TaxableAmount currencyID="EUR">${totals.ht.toFixed(2)}</cbc:TaxableAmount>
      <cbc:TaxAmount currencyID="EUR">${totals.tva.toFixed(2)}</cbc:TaxAmount>
      <cac:TaxCategory>
        <cbc:Percent>${totals.rate}</cbc:Percent>
        <cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme>
      </cac:TaxCategory>
    </cac:TaxSubtotal>
  </cac:TaxTotal>
  <cac:LegalMonetaryTotal>
    <cbc:LineExtensionAmount currencyID="EUR">${totals.ht.toFixed(2)}</cbc:LineExtensionAmount>
    <cbc:TaxExclusiveAmount currencyID="EUR">${totals.ht.toFixed(2)}</cbc:TaxExclusiveAmount>
    <cbc:TaxInclusiveAmount currencyID="EUR">${totals.ttc.toFixed(2)}</cbc:TaxInclusiveAmount>
    <cbc:PayableAmount currencyID="EUR">${totals.ttc.toFixed(2)}</cbc:PayableAmount>
  </cac:LegalMonetaryTotal>
${lines}
</Invoice>`;
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------- Event handling ---------------- */
function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{
    state.view = el.getAttribute('data-nav'); state.search=''; render();
  }));

  const searchEl = app.querySelector('[data-search-orders],[data-search-stock],[data-search-clients],[data-search-catalog]');
  if(searchEl){
    searchEl.addEventListener('input', (e)=>{ state.search = e.target.value; renderKeepFocus(searchEl); });
  }

  app.querySelectorAll('[data-invoice-filter]').forEach(el=>el.addEventListener('click', ()=>{
    state.invoiceFilter = el.getAttribute('data-invoice-filter'); render();
  }));

  app.querySelectorAll('[data-status-order]').forEach(el=>el.addEventListener('change', async (e)=>{
    const id = el.getAttribute('data-status-order');
    const o = state.data.orders.find(o=>o.id===id);
    if(o){ o.status = e.target.value; await persist(); render(); }
  }));

  app.querySelectorAll('[data-toggle-paid]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.getAttribute('data-toggle-paid');
    const o = state.data.orders.find(o=>o.id===id);
    if(o){ o.paid = !o.paid; await persist();
      if(state.modal && state.modal.type==='orderDetail') state.modal.payload = o;
      render();
    }
  }));

  app.querySelectorAll('[data-open-order-detail]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-open-order-detail');
    const o = state.data.orders.find(o=>o.id===id);
    if(o){ state.modal = {type:'orderDetail', payload:o}; render(); }
  }));

  app.querySelectorAll('[data-export-ubl]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-export-ubl');
    const o = state.data.orders.find(o=>o.id===id);
    if(o){ downloadFile(`FAC-${o.id.slice(-6)}-ubl.xml`, generateUBL(o), 'application/xml'); }
  }));

  app.querySelectorAll('[data-edit-order]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-edit-order');
    const o = state.data.orders.find(o=>o.id===id);
    orderDraft = null;
    state.modal = {type:'order', payload:o}; render();
  }));

  // product modal open/edit/delete
  const openProductBtn = app.querySelector('[data-open-product-modal]');
  if(openProductBtn) openProductBtn.addEventListener('click', ()=>{ state.modal={type:'product', payload:null}; render(); });
  app.querySelectorAll('[data-edit-product]').forEach(el=>el.addEventListener('click', ()=>{
    const p = state.data.products.find(p=>p.id===el.getAttribute('data-edit-product'));
    state.modal = {type:'product', payload:p}; render();
  }));
  app.querySelectorAll('[data-delete-product]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.getAttribute('data-delete-product');
    if(confirm('Supprimer ce produit du stock ?')){
      state.data.products = state.data.products.filter(p=>p.id!==id);
      await persist(); render();
    }
  }));

  // client modal open/edit/delete
  const openClientBtn = app.querySelector('[data-open-client-modal]');
  if(openClientBtn) openClientBtn.addEventListener('click', ()=>{ state.modal={type:'client', payload:null}; render(); });
  app.querySelectorAll('[data-edit-client]').forEach(el=>el.addEventListener('click', ()=>{
    const c = state.data.clients.find(c=>c.id===el.getAttribute('data-edit-client'));
    state.modal = {type:'client', payload:c}; render();
  }));
  app.querySelectorAll('[data-delete-client]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.getAttribute('data-delete-client');
    if(confirm('Supprimer ce client ? Ses commandes existantes seront conservées.')){
      state.data.clients = state.data.clients.filter(c=>c.id!==id);
      await persist(); render();
    }
  }));

  // confection option modal open/edit/delete
  const openOptionBtn = app.querySelector('[data-open-option-modal]');
  if(openOptionBtn) openOptionBtn.addEventListener('click', ()=>{ state.modal={type:'option', payload:null}; render(); });
  app.querySelectorAll('[data-edit-option]').forEach(el=>el.addEventListener('click', ()=>{
    const o = state.data.confectionOptions.find(o=>o.id===el.getAttribute('data-edit-option'));
    state.modal = {type:'option', payload:o}; render();
  }));
  app.querySelectorAll('[data-delete-option]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.getAttribute('data-delete-option');
    if(confirm('Supprimer cette option de confection ?')){
      state.data.confectionOptions = state.data.confectionOptions.filter(o=>o.id!==id);
      await persist(); render();
    }
  }));

  // order modal open
  const openOrderBtn = app.querySelector('[data-open-order-modal]');
  if(openOrderBtn) openOrderBtn.addEventListener('click', ()=>{ orderDraft = null; state.modal = {type:'order', payload:null}; render(); });

  // close modal
  app.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target !== el) return;
    state.modal = null; orderDraft = null; render();
  }));
  app.querySelectorAll('[data-stop]').forEach(el=>el.addEventListener('click', (e)=>e.stopPropagation()));

  // product form submit
  const pf = document.getElementById('product-form');
  if(pf) pf.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('pf-name').value.trim();
    const price = parseFloat(document.getElementById('pf-price').value);
    const stock = parseInt(document.getElementById('pf-stock').value);
    const errEl = document.getElementById('pf-err');
    if(!name || isNaN(price) || price < 0 || isNaN(stock) || stock < 0){
      errEl.classList.add('show'); return;
    }
    errEl.classList.remove('show');
    const sku = document.getElementById('pf-sku').value.trim();
    const category = document.getElementById('pf-category').value.trim();
    const unit = document.getElementById('pf-unit').value;
    const lowStockAt = parseInt(document.getElementById('pf-low').value) || 0;
    const editing = state.modal.payload;
    if(editing){
      Object.assign(editing, {name, sku, category, price, unit, stock, lowStockAt});
    } else {
      state.data.products.push({id:uid('prod'), name, sku, category, price, unit, stock, lowStockAt});
    }
    await persist();
    state.modal = null; render();
  });

  // client form submit
  const cf = document.getElementById('client-form');
  if(cf) cf.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('cf-name').value.trim();
    const errEl = document.getElementById('cf-err');
    if(!name){ errEl.classList.add('show'); return; }
    errEl.classList.remove('show');
    const email = document.getElementById('cf-email').value.trim();
    const phone = document.getElementById('cf-phone').value.trim();
    const address = document.getElementById('cf-address').value.trim();
    const vat = document.getElementById('cf-vat').value.trim();
    const editing = state.modal.payload;
    if(editing){
      Object.assign(editing, {name, email, phone, address, vat});
    } else {
      state.data.clients.push({id:uid('cli'), name, email, phone, address, vat});
    }
    await persist();
    state.modal = null; render();
  });

  // confection option form submit
  const of2 = document.getElementById('option-form');
  if(of2) of2.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('of2-name').value.trim();
    const price = parseFloat(document.getElementById('of2-price').value);
    const errEl = document.getElementById('of2-err');
    if(!name || isNaN(price) || price < 0){ errEl.classList.add('show'); return; }
    errEl.classList.remove('show');
    const unit = document.getElementById('of2-unit').value;
    const editing = state.modal.payload;
    if(editing){
      Object.assign(editing, {name, price, unit});
    } else {
      state.data.confectionOptions.push({id:uid('opt'), name, price, unit});
    }
    await persist();
    state.modal = null; render();
  });

  // company settings form submit
  const cof = document.getElementById('company-form');
  if(cof) cof.addEventListener('submit', async (e)=>{
    e.preventDefault();
    state.data.company = {
      name: document.getElementById('co-name').value.trim(),
      vat: document.getElementById('co-vat').value.trim(),
      vatRate: parseFloat(document.getElementById('co-rate').value) || 0,
      address: document.getElementById('co-address').value.trim(),
      iban: document.getElementById('co-iban').value.trim(),
      email: document.getElementById('co-email').value.trim(),
    };
    await persist();
    render();
  });

  // order builder interactions
  const clientSel = document.getElementById('of-client');
  if(clientSel) clientSel.addEventListener('change', (e)=>{ orderDraft.clientId = e.target.value; });
  const dateInput = document.getElementById('of-date');
  if(dateInput) dateInput.addEventListener('change', (e)=>{ orderDraft.date = e.target.value; });
  const statusSel = document.getElementById('of-status');
  if(statusSel) statusSel.addEventListener('change', (e)=>{ orderDraft.status = e.target.value; });

  app.querySelectorAll('.line-product').forEach(el=>el.addEventListener('change', (e)=>{
    const idx = parseInt(el.getAttribute('data-idx'));
    const prod = productById(e.target.value);
    orderDraft.items[idx].productId = e.target.value;
    orderDraft.items[idx].price = prod ? prod.price : 0;
    orderDraft.items[idx].unit = prod ? prod.unit : 'piece';
    orderDraft.items[idx].measure = null;
    rerenderOrderModalInPlace();
  }));
  app.querySelectorAll('.line-qty').forEach(el=>el.addEventListener('input', (e)=>{
    const idx = parseInt(el.getAttribute('data-idx'));
    orderDraft.items[idx].qty = parseFloat(e.target.value) || 0;
    rerenderOrderModalInPlace();
  }));
  app.querySelectorAll('.line-measure-toggle').forEach(el=>el.addEventListener('change', (e)=>{
    const idx = parseInt(el.getAttribute('data-idx'));
    if(e.target.checked){
      orderDraft.items[idx].measure = {width:'', height:'', panels:1};
    } else {
      orderDraft.items[idx].measure = null;
    }
    rerenderOrderModalInPlace();
  }));
  app.querySelectorAll('.measure-width,.measure-height,.measure-panels').forEach(el=>el.addEventListener('input', (e)=>{
    const idx = parseInt(el.getAttribute('data-idx'));
    const item = orderDraft.items[idx];
    if(!item.measure) return;
    if(el.classList.contains('measure-width')) item.measure.width = e.target.value;
    if(el.classList.contains('measure-height')) item.measure.height = e.target.value;
    if(el.classList.contains('measure-panels')) item.measure.panels = e.target.value;
    item.qty = computeMeasureQty(item.measure.width, item.measure.height, item.measure.panels);
    rerenderOrderModalInPlace();
  }));
  app.querySelectorAll('.line-option').forEach(el=>el.addEventListener('change', (e)=>{
    const idx = parseInt(el.getAttribute('data-idx'));
    const optId = el.getAttribute('data-opt');
    const item = orderDraft.items[idx];
    item.optionIds = item.optionIds || [];
    if(e.target.checked){
      if(!item.optionIds.includes(optId)) item.optionIds.push(optId);
    } else {
      item.optionIds = item.optionIds.filter(id=>id!==optId);
    }
    rerenderOrderModalInPlace();
  }));
  app.querySelectorAll('.supp-desc').forEach(el=>el.addEventListener('input', (e)=>{
    const idx = parseInt(el.getAttribute('data-idx'));
    orderDraft.items[idx].description = e.target.value;
  }));
  app.querySelectorAll('.supp-qty').forEach(el=>el.addEventListener('input', (e)=>{
    const idx = parseInt(el.getAttribute('data-idx'));
    orderDraft.items[idx].qty = parseFloat(e.target.value) || 0;
    rerenderOrderModalInPlace();
  }));
  app.querySelectorAll('.supp-price').forEach(el=>el.addEventListener('input', (e)=>{
    const idx = parseInt(el.getAttribute('data-idx'));
    orderDraft.items[idx].price = parseFloat(e.target.value) || 0;
    rerenderOrderModalInPlace();
  }));
  app.querySelectorAll('.line-remove').forEach(el=>el.addEventListener('click', (e)=>{
    const idx = parseInt(el.getAttribute('data-idx'));
    orderDraft.items.splice(idx,1);
    rerenderOrderModalInPlace();
  }));
  const addLineBtn = document.getElementById('add-line');
  if(addLineBtn) addLineBtn.addEventListener('click', ()=>{
    orderDraft.items.push({type:'product', productId:'', qty:1, price:0, unit:'piece', measure:null, optionIds:[]});
    rerenderOrderModalInPlace();
  });
  const addSuppBtn = document.getElementById('add-supplement');
  if(addSuppBtn) addSuppBtn.addEventListener('click', ()=>{
    orderDraft.items.push({type:'supplement', description:'', qty:1, price:0});
    rerenderOrderModalInPlace();
  });

  const ofSave = document.getElementById('of-save');
  if(ofSave) ofSave.addEventListener('click', async ()=>{
    const errEl = document.getElementById('of-err');
    const validItems = orderDraft.items.filter(i=>{
      if(i.type==='supplement') return i.description && i.description.trim() && i.qty > 0;
      return i.productId && i.qty > 0;
    });
    if(!orderDraft.clientId || validItems.length===0){
      errEl.classList.add('show'); return;
    }
    errEl.classList.remove('show');
    orderDraft.items = validItems;
    const existing = state.modal.payload;
    if(existing){
      Object.assign(existing, orderDraft);
    } else {
      state.data.orders.push({id:uid('ord'), ...orderDraft});
    }
    await persist();
    orderDraft = null;
    state.modal = null; render();
  });
}

function rerenderOrderModalInPlace(){
  const overlay = document.querySelector('.overlay');
  if(!overlay) return;
  overlay.outerHTML = renderModal();
  attachHandlers();
}

function renderKeepFocus(prevEl){
  const app = document.getElementById('app');
  const selectorAttr = prevEl.getAttribute('data-search-orders')!==null ? 'data-search-orders'
    : prevEl.getAttribute('data-search-stock')!==null ? 'data-search-stock'
    : prevEl.getAttribute('data-search-clients')!==null ? 'data-search-clients' : 'data-search-catalog';
  const cursorPos = prevEl.selectionStart;
  render();
  const newEl = document.querySelector(`[${selectorAttr}]`);
  if(newEl){ newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
}

loadData();
</script>
</body>
</html>
