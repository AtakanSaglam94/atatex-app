# Ce dépôt alimente DEUX sites Netlify (même repo) :
#   • app de gestion (privée)  → domaine *.netlify.app  (ou gestion.ata-tex.be)
#   • boutique publique         → ata-tex.be
#
# scripts/build.mjs détecte le site (via SITE_NAME / URL) et lance la bonne
# cible ; les deux publient "dist". Rien à régler dans l'UI Netlify hormis,
# pour le site boutique, connecter le repo et ajouter le domaine ata-tex.be
# (Netlify expose SITE_NAME et URL au build, ce qui suffit à la détection).
# Au besoin, forcer avec la variable d'environnement BUILD_TARGET=shop.

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA : toutes les routes servent index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
